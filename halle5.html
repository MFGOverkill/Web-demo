<!DOCTYPE html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    </head>
    <body style="margin:0px; overflow: hidden;">
        <a-scene embedded arjs="sourceType: webcam;">

            <!--Hier benutze ich keine 3D-Modelle die ich reinlade sondern A-Frame-Primitives-->

            <a-marker type="pattern" url="Patterns/pattern-hiro.patt">
                <a-box color="red" height="0.5" width="2" depth="2" position="0 1 0"></a-box>
            </a-marker>

            <a-marker type="pattern" url="Patterns/pattern-kanji.patt">
                <a-sphere color="green" radius="0.5" position="3 1 0"></a-sphere>
            </a-marker>

            <a-marker type="pattern" url="Patterns/pattern-letterA.patt">
                <a-cylinder color="blue" height="2" radius="0.5" rotation="0 0 -90"></a-cylinder>
            </a-marker>

            <a-marker type="pattern" url="Patterns/pattern-Marker_1.patt">
                <a-torus color="orange" arc="660" radius="1.5" radius-tubular="0.1" rotation="-90 0 0" position="0 1 0"></a-torus>
            </a-marker>

            <a-marker type="pattern" url="Patterns/pattern-Marker_2.2.patt">
                <a-torus-knot color="gray" arc="180" p="2" q="7" radius="1.5" radius-tubular="0.05" rotation="-90 0 0"></a-torus-knot>
            </a-marker>

            <a-marker type="pattern" url="Patterns/pattern-Marker_3.patt">
                <a-box position="-2 1 0" color="cyan" animation="property: position; to: 2 1 0; dur: 2000; easing: linear; loop: true"></a-box>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
