<!DOCTYPE html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    </head>
    <body style="margin:0px; overflow: hidden;">
        <a-scene embedded arjs="sourceType: webcam;">

            <a-assets>
                <a-asset-item id= "einzigartige_id_1" src="Relativer Pfad zu der .obj-Datei"></a-assets-item>
                <a-asset-item id= "einzigartige_id_2" src="Relativer Pfad zu der .mtl-Datei"></a-assets-item>
            </a-assets>
            
            <a-marker type="pattern" url="Relativer Pfad zu der .patt-Datei">
                <a-entity obj-model="obj: #einzigartige_id_1; mtl: #einzigartige_id_2" position="0 0 0" scale="1 1 1" rotation="0 0 0" >
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
